[project]
name = "linkbook-api"
version = "0.0.0"
description = "Linkbook API — Python port"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.34",
    "sqlalchemy>=2.0.40",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "httpx>=0.28",
    "anyio>=4.6",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-anyio>=0.0",
    "ruff>=0.8",
]

[project.scripts]
# `linkbook` runs the API on 127.0.0.1:3000 (override via PORT/HOST env)
linkbook = "linkbook.__main__:main"
linkbook-migrate = "linkbook.db.migrate:main"
linkbook-seed = "linkbook.seed:_run_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/linkbook"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = ["E501"]
